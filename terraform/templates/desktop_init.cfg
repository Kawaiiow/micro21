#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - name: ${username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, sudo
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_key}

package_update: true
packages:
  - qemu-guest-agent
  - xfce4
  - xfce4-goodies
  - lightdm
  - firefox
  - vim

runcmd:
  - systemctl enable --now qemu-guest-agent
  - systemctl set-default graphical.target
  - systemctl start lightdm

